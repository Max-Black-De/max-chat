# CI (ТЗ Д-5): npm ci → lint → typecheck → test → build на push в main и на каждый PR.
# Секреты инстанса GREEN-API в CI не нужны и не используются: тесты работают только на моках.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  HUSKY: 0 # git-хуки в CI не ставим

jobs:
  check:
    name: lint · typecheck · test · build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # нужна история для проверки сообщений коммитов в PR
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install
        run: npm ci

      - name: Commit messages (Conventional Commits, Д-8)
        if: github.event_name == 'pull_request'
        run: >-
          npx --no -- commitlint --verbose
          --from ${{ github.event.pull_request.base.sha }}
          --to ${{ github.event.pull_request.head.sha }}

      - name: Lint (ESLint + Prettier)
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      # Д-2 (позже): e2e Playwright на моках — `npx playwright install --with-deps chromium`
      # и `npm run e2e` после сборки.

      - name: Build
        run: npm run build

      - name: Upload dist
        uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist
          retention-days: 7

  # Д-1 (позже): деплой демо на GitHub Pages из этого же workflow.
  # Набросок:
  #   - в job `check` собрать с BASE_PATH=/<repo>/ и загрузить actions/upload-pages-artifact;
  #   - job `deploy`: needs: check, if: github.ref == 'refs/heads/main' && github.event_name == 'push',
  #     permissions: { pages: write, id-token: write }, environment: github-pages,
  #     steps: actions/deploy-pages.
