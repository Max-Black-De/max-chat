# CI (ТЗ Д-5) и деплой демо (Д-1) в одном workflow:
#   check   — npm ci → lint → typecheck → test → build (BASE_PATH=/<repo>/) → verify:dist;
#   secrets — gitleaks по всей истории git (все ветки и теги);
#   deploy  — только push в main / ручной запуск на main и только после зелёных check и secrets:
#             на GitHub Pages уходит ровно та сборка, которую проверил check.
# Секреты инстанса GREEN-API в CI не нужны и не используются: тесты работают только на моках,
# в сборку не попадает ни один VITE_*-креденшел (env сборки — только BASE_PATH).
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  # PR: новый пуш отменяет старый прогон. main: прогоны не отменяются, чтобы не оборвать деплой.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  HUSKY: 0 # git-хуки в CI не ставим

jobs:
  check:
    name: lint · typecheck · test · build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # Д-1: GitHub Pages отдаёт проект по подпути /<repo>/ (vite.config.ts → base).
      BASE_PATH: /${{ github.event.repository.name }}/
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # нужна история для проверки сообщений коммитов в PR
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install
        run: npm ci

      - name: Commit messages (Conventional Commits, Д-8)
        if: github.event_name == 'pull_request'
        run: >-
          npx --no -- commitlint --verbose
          --from ${{ github.event.pull_request.base.sha }}
          --to ${{ github.event.pull_request.head.sha }}

      - name: Lint (ESLint + Prettier)
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      # Д-2 (позже): e2e Playwright на моках — `npx playwright install --with-deps chromium`
      # и `npm run e2e` после сборки.

      - name: Build
        run: npm run build

      - name: Verify dist (CSP-meta, без инлайн-скриптов, ассеты под base)
        run: npm run verify:dist

      - name: Upload dist
        uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist
          retention-days: 7

      - name: Upload Pages artifact
        if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  secrets:
    name: secrets (gitleaks)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      # Бинарь с фиксированной версией и sha256 из gitleaks_<ver>_checksums.txt релиза.
      GITLEAKS_VERSION: 8.30.1
      GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # вся история всех веток и тегов
          persist-credentials: false

      - name: Install gitleaks
        run: |
          archive="$RUNNER_TEMP/gitleaks.tar.gz"
          curl -sSfL -o "$archive" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  ${archive}" | sha256sum -c -
          tar -xzf "$archive" -C "$RUNNER_TEMP" gitleaks
          "$RUNNER_TEMP/gitleaks" version

      - name: Scan git history
        # --redact: найденное значение не печатается в публичный лог.
        run: >-
          "$RUNNER_TEMP/gitleaks" git --config .gitleaks.toml --redact --no-banner --verbose
          --log-opts="--all" .

  deploy:
    name: deploy (GitHub Pages)
    needs: [check, secrets]
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: false # не обрывать начатый деплой
    steps:
      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v6

      - name: Check base path
        # Сборка в check идёт с BASE_PATH=/<repo>/; если у Pages другой путь (свой домен,
        # user-site), ассеты не загрузятся — лучше упасть до деплоя.
        env:
          PAGES_BASE_PATH: ${{ steps.pages.outputs.base_path }}
          BUILD_BASE_PATH: /${{ github.event.repository.name }}
        run: |
          echo "Pages base_path: ${PAGES_BASE_PATH}"
          test "${PAGES_BASE_PATH}" = "${BUILD_BASE_PATH}"

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
